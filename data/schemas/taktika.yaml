---
# Schema: taktikak.yaml
# Gyökér: taktikák (lista)

taktikák:
  - név: ""                    # kötelező, string
    id: ""                     # kötelező, egyedi azonosító (snake_case, ékezetes)
    feltétel_kulcs: ""         # generált (id-ból), "taktika:xyz" formátum — a source yaml-ban NEM szerepel
    fokozatos: false           # kötelező, boolean
    skálázható: false          # opcionális, boolean — a fok a karakter szintjéhez skálázódik (konstansok.skálázható_taktika_max_fok)
    # Ha fokozatos: false → módosítók dict (opcionális, TÉ/VÉ/KÉ/SP kulcsok)
    módosítók:                 # opcionális (fokozatos: false esetén)
      TÉ: 0
      VÉ: 0
      KÉ: 0
      SP: 0
    # Nem-fokozatos taktika strukturált hatása (előny/hátrány/enyhít/szöveges) egy dobáscélra.
    # Pl. Visszafogott: Hátrány-2 a sebzésdobásra (a módosítók.TÉ mellett).
    hatások:                   # opcionális (fokozatos: false esetén)
      - { hatás: "", érték: 0, cél: "", megjegyzés: "" }
    # Ha fokozatos: true → fokok lista (mindegyik fok+módosítók)
    fokok:                     # opcionális (fokozatos: true esetén)
      - { fok: 1, TÉ: 0, VÉ: 0, KÉ: 0, SP: 0 }
    megjegyzés: ""             # opcionális, string
    # Megkötések: kontextuális feltételek a taktika alkalmazhatóságára
    # típus: "harci_helyzet" | "harcmodor" | "szituáció" | "támadások" | "többes_harc" | "per_küzdelem"
    # mód: "tiltott" | "szükséges" | "min" | "max"
    # érték: string | string[] | number (opcionális, típus-függő)
    megkötések:                # opcionális, lista
      - { típus: "", mód: "", érték: "" }
    kombó_mód: "whitelist"     # kötelező, enum: "whitelist" | "blacklist"
    kombó_lista: []            # kötelező, string lista (taktika nevek)
    # Fortély bővítés: ha egy fortély extra taktika fokokat engedélyez
    # fortély: fortély neve, extra_fokok_per_fok: hány extra fok fokonként
    fortély_bővítés:           # opcionális
      fortély: ""
      extra_fokok_per_fok: 0
    csoport: ""                # opcionális, string ("távharc" | "")
    szűrő_harcmodorok: []     # opcionális, string lista — CÉ módosító csak ezekkel a harcmodorokkal érvényes
