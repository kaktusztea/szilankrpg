# Forrás: md/065_01_*.md
# Komplex hatások → informatív megjelenítés + §16 feltétel dispatch
# hatások[]: opcionális, strukturált (Hatás pool-hoz), mint statuszok.yaml-ban

harci_helyzetek:
- név: "Belharci helyzet"
  infó: "Közelharc harcmodor + max 0 pengehossz. Belharcos fortély bónuszok. Egyéb fegyver: fegyver TÉ/VÉ=0."
  megjegyzések:
  - text: "Ha a képzett harcosnak sikerül ellenfele fegyvere mögé, testközelébe kerülni, ebből előnyt kovácsolhat."
  - text: "A belharc magában foglalja a birkózást és a földharcot is."
  - text: "Belharc 1.fok: KÉ+1, TÉ/VÉ+2. Belharc 2.fok: KÉ+2, TÉ/VÉ+4 (a Belharcos fortély bónuszai)."
  - text: "Puszta kéz harcértékei belharcban 0-ra emelkednek (TÉ, VÉ, SP = 0), sebzés FP alapú, 1 ÉP / 5 FP."
  - text: "Nem belharcos fegyverek TÉ/VÉ értéke 0-ra csökken, de a saját harcmodor értékei megmaradnak, és bármikor elejthetők."
  - text: "Állatoknak általában van Belharcos fortélya."
  - text: "Pajzsok belharcban minden pajzs TÉ/VÉ értéke Kis Pajzsnak számít."
  hatások: []
  id: "belharci_helyzet"
  csoport: "semleges"
  rejtett: false
  tiltja_taktikákat: false
  kizár_helyzetek: ["lovas_harc", "léglovas_harc", "harci_szekér", "magasabbról", "levegőből", "takarásban"]
  fegyver_override:
    feltétel:
      - { forrás: "aktív_fegyver_pengehossz", operátor: ">", érték: 0 }
    módosítók:
      - { cél: "fegyver_TÉ", érték: 0, mód: "override" }
      - { cél: "fegyver_VÉ", érték: 0, mód: "override" }
