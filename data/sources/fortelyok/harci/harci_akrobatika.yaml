csoport: "harci"
leírások:
- text: "Pattog, mint a nikkelbolha - mondják, ha harcolni látnak."
- text: "Küzdelem közben akrobatikus elemeket - ugrásokat, vetődéseket, pörgéseket\
    \ - alkalmazol, amelyek előnyhöz juttatnak a földhözragadt kis senkik ellen..."
megjegyzések:
- text: "Fegyverek: A forgatott fegyverek össz fegyverhossza nem lehet nagyobb,\
    \ mint `3` (Például 1db hosszú kard, vagy 1db rövidkard és 1db tőr), továbbá súlyuk\
    \ is fontos tényező (KM dönt)."
- text: "Vértek: 1-2. fok csak nem-fém hajlékony vértben (posztó / fegyverkabát / bőr),\
    \ max effektív MGT:5; 3. fok bármely nem-merev (Hajlékony) vértben, max effektív MGT:10."
- text: "**Alkalmazás**:  ha olyan a szituáció, hogy az alkalmazó nem képes, vagy\
    \ nem akarja alkalmazni harca közben ezt a stílust (pl. túl feltűnő lenne az ugrabugrálása),\
    \ akkor nem kapja meg a leírt bónuszokat."
- text: "**Helyigény**: a KM dönt, hogy van-e elég hely az alkalmazáshoz, de ne\
    \ legyen túl szigorú; egy közepes szobában is alkalmazható (falra ugrás, elrugaszkodás, stb)."
