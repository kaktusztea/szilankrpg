# Fegyvergenerátor - EXTRÁK katalógusa (egységes).
# Minden bejegyzés: {feltétel(ek) → hatás(ok)}. A `feltétel.típus` adja a jellegét,
# a `csoport` az ember-olvasható / megjelenítési besorolást.
# Hivatkozás id-vel, KÉT scope-on:
#   - fegyveren:            fegyverek.yaml → `extrak: [id, ...]`   (fegyver-egyedi)
#   - fegyverhossz-kat.:    konstansok.yaml fegyverhossz → `extrak: [id]`  (öröklődik minden ilyen hosszú fegyverre)
# A generátor a kettőt ÖSSZEFÉSÜLI (unió). A hatás SZITUÁCIÓS (nem a bázisérték);
# a futásidejű kiértékelés a reactive engine későbbi feladata.
#
# STRUKTÚRA (a webapp meglévő két formátumához igazítva):
#   feltétel[] : előfeltételek - a manoverek.yaml `követelmények` STRUKTÚRÁJA:
#       {típus, név | id, érték?}   (ÉS-kapcsolat)
#       típus: fortély | képzettség (érték=fok/szint≥) | státusz | harci_helyzet | taktika | cél_páncél
#            | cél_felszereles | aktor | forgatás | ellenfél_fegyver_sebzésjelleg | narratív (KM)
#   állapot    : az extra OLDALISÁGA (rekord-szintű, kötelező): aktív (én alkalmazom) | passzív (ellenem/a fegyverem ELLEN).
#                A régi `manőver_állapot` FELTÉTELT váltotta ki (dedup, 2026-10-26); a webapp Manőver dobás Mód-jával egyezik.
#   hatás[]    : a fortély `módosítók` STRINGES formátuma: {cél, mód, érték, feltétel?}
#       cél: HARCÉRTÉK/esemény csupasz string (TÉ / VÉ / SP / SFÉ / vé_veszteség / manőver_ellenpróba / harckeret …)
#            VAGY entitás prefix-string ("fortély:<név>"). Manővernél: cél=manőver_ellenpróba + feltétel "manőver:<id>".
#       alcél?: a cél al-scope-ja, "prefix:érték" (alcel_prefix_enum), pl. cél VÉ + alcél "felszerelés:pajzs" = a pajzs VÉ-komponense;
#              harcérték-cél override-hoz KÖTELEZŐ (felszerelés:fegyver / :pajzs / :páncél)
#       feltétel?: al-feltétel prefix-string (pl. "manőver:precíz_támadás")
#       mód: flat | override  (fortély-`módosító` mód) | szorzó  (érték 0.5=felez, 2=dupláz; konstansok.yaml → effekt_módok)

extrak:
  # ── FELKÉSZÍTÉS (kiképzett, opt-in - a régi „extra"/KF) ──
  - id: kulonleges_felkeszites
    név: "Különleges felkészítés"
    csoport: felkészítés
    állapot: aktív
    leírás: >
      Belső harci iskola + Mesterfegyver-tudás kell. Enélkül a felkészítetlen
      alapértékek érvényesek; felkészítve a Mesterfegyver fortély e fegyverre adott bónusza megduplázódik.
    feltétel:
      - {típus: fortély, név: mesterfegyver, érték: 1}   # az adott fegyverre, fok ≥ 1
      - {típus: narratív, név: "Harci iskola"}   # nem gépi: KM dönti el
    hatás:
      # MÁSODRENDŰ: a Mesterfegyver e fegyverre vonatkozó bónuszát szorozza (×2).
      - {cél: "fortély:mesterfegyver", mód: szorzó, érték: 2}

  # ── HARCI HELYZET (szituációs, automatikus) ──
  - id: beszorithato_enyhen
    név: "Beszorítható (enyhén)"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "Közepesen hosszú fegyver (hossz 5): beszorítva a technikák csak részben vihetők ki, fegyver TÉ/VÉ feleződik."
    feltétel:
      - {típus: harci_helyzet, id: beszorítva}
    hatás:
      - {cél: TÉ, alcél: "felszerelés:fegyver_járulék", mód: szorzó, érték: 0.5}
      - {cél: VÉ, alcél: "felszerelés:fegyver_járulék", mód: szorzó, érték: 0.5}

  - id: beszorithato_nagyon
    név: "Beszorítható (nagyon)"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "Hosszú fegyver (hossz 7+): beszorítva nem forgatható rendesen, fegyver TÉ/VÉ:0."
    feltétel:
      - {típus: harci_helyzet, id: beszorítva}
    hatás:
      - {cél: TÉ, alcél: "felszerelés:fegyver_járulék", mód: override, érték: 0}
      - {cél: VÉ, alcél: "felszerelés:fegyver_járulék", mód: override, érték: 0}

  - id: panceltalant_jobban_sebez
    név: "Páncéltalant jobban sebez"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Vérttelen célon nagyobb sebet ejt. Példa: Meneth, Béltépő"
    feltétel:
      - {típus: cél_páncél, érték: vérttelen}
    hatás:
      - {cél: SP, mód: flat, érték: 3}

  - id: pocsek_vedekezo_pancelos_ellen
    név: "Pocsék védekező (páncélos ellen)"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "Páncélos ellenfél ellen a hárítási hátrány kiütközik - VÉ:0. Páncéltalan ellen a kontakt-fenyegetés miatt a bázis VÉ marad."
    feltétel:
      - {típus: cél_páncél, érték: páncélos}
    hatás:
      - {cél: VÉ, alcél: "felszerelés:fegyver", mód: override, érték: 0}

  - id: pancelszuras_belharcban
    név: "Belharcban rések közt beszúr"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Belharcban a fegyverhossz-korlát rá nem vonatkozik; földön lévő ellenfélnél a rések közt szúr - a páncél SFÉ-je 0."
    feltétel:
      - {típus: harci_helyzet, id: belharci_helyzet}
    hatás:
      - {cél: "tiltás:belharc_fegyverhossz", mód: letilt}   # a Belharc hossz-tiltása erre a fegyverre nem él
      - {cél: SFÉ, alcél: "felszerelés:páncél", mód: override, érték: 0, feltétel: "ellenfél_harci_helyzet:földön_fekve"}   # KM: az ellenfél állapota

  - id: puszta_kez_belharcban
    név: "Puszta kéz belharcban"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Puszta kéz Belharci helyzetben: TÉ, VÉ, SP = 0 (a fegyvertelen büntetés megszűnik). Természetes fegyver fortéllyal az SP 1 marad."
    feltétel:
      - {típus: harci_helyzet, id: belharci_helyzet}
    hatás:
      - {cél: TÉ, alcél: "felszerelés:fegyver", mód: override, érték: 0}
      - {cél: VÉ, alcél: "felszerelés:fegyver", mód: override, érték: 0}
      - {cél: SP, alcél: "felszerelés:fegyver", mód: override, érték: 0}

  - id: pikas_kozrefogasa
    név: "Pikás közrefogása"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "Ha pikával harcolsz és közrefognak, a fegyver az egyik (választott) támadó ellen 0 harcértékű."
    feltétel:
      - {típus: harci_helyzet, id: közrefogás}
      - {típus: narratív, név: "Választott támadó ellen"}   # KM/játékos választja, MELYIK támadó ellen
    hatás:
      - {cél: TÉ, alcél: "felszerelés:fegyver", mód: override, érték: 0}
      - {cél: VÉ, alcél: "felszerelés:fegyver", mód: override, érték: 0}

  - id: kopjas_roham
    név: "Kopja lovas rohamban"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Lovas roham taktikában a kopja alap Sebzéséhez +10 SP bónusz adódik (harci és tornakopja is)."
    feltétel:
      - {típus: taktika, id: lovas_roham}
    hatás:
      - {cél: SP, mód: flat, érték: 10}

  - id: lancos_pajzs_ve_felezes
    név: "Láncos: pajzs VÉ felezés"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "A láncos fej megkerüli a pajzsot - a pajzs adta VÉ feleződik."
    feltétel:
      - {típus: cél_felszereles, érték: pajzs}
    hatás:
      - {cél: VÉ, alcél: "felszerelés:pajzs", mód: szorzó, érték: 0.5}

  - id: pajzs_megkerulese
    név: "Pajzs megkerülése"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Hajlékony fegyver a pajzs mögé csap, a pajzs adta VÉ NEM számít ellene (teljes megkerülés)."
    feltétel:
      - {típus: cél_felszereles, érték: pajzs}
    hatás:
      - {cél: VÉ, alcél: "felszerelés:pajzs", mód: szorzó, érték: 0}

  - id: fegyvertores_immunis
    név: "Fegyvertörés-immunis"
    csoport: harci_helyzet
    állapot: passzív
    leírás: "Hajlékony (nem merev) fegyver, a Fegyvertörés manőver nem fog rajta."
    hatás:
      - {cél: manőver_ellenpróba, mód: letilt, feltétel: "manőver:fegyvertörés"}

  - id: manover_fegyvertores_ellene_konnyebb_fanyel
    név: "Manőver Fegyvertörés ellene könnyebb (fanyél)"
    csoport: tulajdonság
    állapot: passzív
    leírás: "Fanyelű fegyver: Fegyvertörés manővernél a passzív fél (akié a fegyver) dobása -2 (az ő fegyverét könnyebb eltörni)."
    feltétel:
      - {típus: narratív, név: "Ellenfél fegyvere fém"}
    hatás:
      - {cél: manőver_ellenpróba, mód: flat, érték: -2, feltétel: "manőver:fegyvertörés"}

  - id: sfe_duplazodik
    név: "SFÉ dupla ellene"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Páncél ellen különösen rossz, a célpont páncél SFÉ-je duplán számít."
    feltétel:
      - {típus: cél_páncél, érték: páncélos}
    hatás:
      - {cél: SFÉ, mód: szorzó, érték: 2}

  - id: pajzsrongáló
    név: "Pajzsrongáló"
    csoport: harci_helyzet
    állapot: aktív
    leírás: >
      Kimondottan pajzs megrongálására alkalmas kézi fegyver. Ha a cél pajzsot használ és a
      Támadó dobás k20 eredménye 11-20, a cél Pajzs-VÉ-je véglegesen -1 (KM könyveli).
    feltétel:
      - {típus: cél_felszereles, érték: pajzs}
      - {típus: narratív, név: "Támadó dobás k20: 11-20"}   # dobás-gate, nem automatikus
    hatás:
      - {cél: pajzs-VÉ, mód: szöveges}

  - id: pajzsbénító
    név: "Pajzsbénító"
    csoport: harci_helyzet
    állapot: aktív
    leírás: >
      Hajítófegyver, pajzsba dobva megakad benne és akadályozza használatát. Ha a cél pajzsot használ és a
      Célzó dobás a pajzsot találja: kisebb hajítófegyver → Pajzs-VÉ:-3 (kihúzásig) + Blokkolt (1);
      szálfegyver → Pajzs-VÉ:-5 (kihúzásig) + Blokkolt (2). (KM könyveli.)
    feltétel:
      - {típus: cél_felszereles, érték: pajzs}
      - {típus: narratív, név: "Célzó dobás találat: pajzsot"}   # dobás-gate, nem automatikus
    hatás:
      - {cél: pajzs-VÉ, mód: szöveges}

  - id: beakadas_kockazat
    név: "Beakad (~50%)"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Sebző találat után (tehát átment a páncélon) ~50% esély, hogy beakad és harc közben nem húzható ki (KM dönti el)."
    hatás:
      - {cél: "beakadás", mód: szöveges}

  - id: onsebzes_kockazat
    név: "Önsebzés-kockázat"
    csoport: tulajdonság
    állapot: aktív
    leírás: >
      Köz- és önveszélyes: a támadó k20 EGYBEN esélydobás - Mesterfegyver-foktól függő küszöb (Mf nélkül 1-10,
      Mf:1.fok 1-2, Mf:2-3.fok nincs) alá/rá dobva magadat sebzed (rendes sebzés önmagad ellen). Részletek: md/068_06.
    hatás:
      - {cél: "önsebzés", mód: szöveges}

  # ── TULAJDONSÁG (építési/minőségi opció) ──
  - id: manover_preciz_tamadas_konnyebb_pontos
    név: "Manőver Precíz támadás könnyebb (pontos)"
    csoport: tulajdonság
    állapot: aktív
    leírás: >
      Precíziós szúróhegy: a Precíz támadás manőver Ellenpróbára bónusz: +2.
      Csak pengehegy aktor + egykezes forgatás mellett értelmes.
    feltétel:
      - {típus: aktor, érték: pengehegy}
      - {típus: forgatás, érték: egykezes}
    hatás:
      - {cél: manőver_ellenpróba, mód: flat, érték: 2, feltétel: "manőver:precíz_támadás"}

  - id: manover_lefegyverezes_ellene_konnyebb
    név: "Manőver Lefegyverezés ellene könnyebb"
    csoport: tulajdonság
    állapot: passzív
    leírás: >
      Az ilyen fegyvert az ellenfél könnyebben kiüti kezedből, könnyebben eltöri.
      Lefegyverzés / Fegyvertörés manővernél a passzív fél (akié a fegyver) dobása -2.
    feltétel:
      - {típus: forgatás, érték: egykezes}
    hatás:
      - {cél: manőver_ellenpróba, mód: flat, érték: -2, feltétel: "manőver:lefegyverzés"}

  - id: manover_lefegyverzes_ellene_nehezebb
    név: "Manőver Lefegyverzés ellene nehezebb"
    csoport: tulajdonság
    állapot: passzív
    leírás: >
      A fegyvert az ellenfél nehezebben üti ki a kezedből.
      Lefegyverzés manővernél a passzív fél (akié a fegyver) dobása +2 (nehezebb lefegyverezni).
    hatás:
      - {cél: manőver_ellenpróba, mód: flat, érték: 2, feltétel: "manőver:lefegyverzés"}

  - id: zuzo_ellen_rosszabb
    név: "Zúzó fegyver ellen rosszabb"
    csoport: tulajdonság
    állapot: passzív
    leírás: >
      Fegyvered nem túl alkalmas zúzó fegyverek támadásainak hárítására.
      Elszenvedett VÉ csökkenésed duplázódik.
    feltétel:
      - {típus: ellenfél_fegyver_sebzésjelleg, érték: Z}   # Z = zúzó (kanonikus egybetűs sebzésjelleg)
    hatás:
      - {cél: vé_veszteség, mód: szorzó, érték: 2}

  - id: manover_labkirantas_konnyebb_kampos_veggel
    név: "Manőver Lábkirántás könnyebb (kampós véggel)"
    csoport: tulajdonság
    állapot: aktív
    leírás: >
      A fegyver kampós vége a Lábkirántás manőver Ellenpróba dobásához +2 Helyzetfüggő módosítót ad.
      Jelenleg nincs fegyver, ami használja.
      pl. glaive-szerű penge -- fegyverek.yaml → `extrak: [kampos_veggel_labkirantas]`).
    feltétel:
      - {típus: aktor, érték: kampós}
    hatás:
      - {cél: manőver_ellenpróba, mód: flat, érték: 2, feltétel: "manőver:lábkirántás_szálfegyverrel"}

  # ── TÁVHARC extrák (tavfegyverek_fixed.json hivatkozza) ──
  - id: tavharc_sfe_duplan
    név: "Távharc SFÉ duplán számít ellene"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "A célpont páncél SFÉ-je duplán számít e lövedék ellen (pl. Dobócsillag, Parittya)."
    hatás:
      - {cél: SFÉ, mód: szorzó, érték: 2}

  - id: tavharc_ij_erobonusz_tervezett
    név: "Távharc íj Erőbónusz tervezett"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Az íj Erőbónusza csak akkor számít, ha az íj erre az Erő értékre lett tervezve (KM)."
    hatás:
      - {cél: SP, mód: szöveges}

  - id: tavharc_kozeli_loves_automatikus_bonusz
    név: "Távharc Közeli lövés automatikus bónusz"
    csoport: harci_helyzet
    állapot: aktív
    leírás: "Ha a célpont az 1. Cellában van, automatikusan jár a Közeli lövés fortély CÉ:+10 bónusza."
    hatás:
      - {cél: CÉ, mód: szöveges}

  - id: tavharc_ertekek_csak_keszito_kezeben
    név: "Távharc Értékek csak készítő kezében"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Az értékek csak a készítő-birtokos kezében érvényesek; másnak hagyományos íjként (Osztó 4, nincs Erőbónusz)."
    hatás:
      - {cél: CÉ, mód: szöveges}

  - id: tavharc_ujratoltes_kharei
    név: "Távharc Újratöltés (Kharei)"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Míg ki nem fogy a tár, sebesség-büntetés nélkül lő; utána újratöltés 1 kör (KM)."
    hatás:
      - {cél: sebesség, mód: szöveges}

  - id: tavharc_ujratoltes_shad0ni
    név: "Távharc Újratöltés (Shad0ni)"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Újratöltés: 1 emberrel 3 kör, 2 emberrel 1 kör (KM)."
    hatás:
      - {cél: sebesség, mód: szöveges}

  - id: tavharc_aquir_kezben_azonnali_halal
    név: "Távharc Aquir kézben azonnali halál"
    csoport: tulajdonság
    állapot: aktív
    leírás: "Aquir kézben találatkor azonnali halált okoz; az Átütés is csak aquir kézben érvényes (KM)."
    hatás:
      - {cél: halál, mód: szöveges}

  - id: tavharc_fuvocso_kicsi_hatas
    név: "Távharc Fúvócső (kicsi) hatas"
    csoport: tulajdonság
    állapot: aktív
    leírás: "k20 Sebzésdobásnál: 20 → 1 ÉP, egyébként 0 ÉP (a méreg/altató a lényeg, KM)."
    hatás:
      - {cél: SP, mód: szöveges}
