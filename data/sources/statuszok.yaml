- id: bénultság
  név: Bénultság
  kategória: fizikai
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Cselekvőképtelenség
    megjegyzések:
    - text: "Beszélni még tudsz, és szellemi képességeket tudsz használni."
    hatások:
    - hatás: harcképtelenség
    - hatás: mozgás_képtelen
      megjegyzés: nyaktól lefelé
  - fok: 2
    alcím: Paralízis
    hatások:
    - hatás: harcképtelenség
    - hatás: mozgás_képtelen
    - hatás: beszéd_némult
- id: blokkolt
  név: Blokkolt
  kategória: fizikai
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Közepesen
    megjegyzések:
    - text: "Harci lassulást értünk ez alatt, amit jellemzően különféle mágikus hatások okoznak."
    hatások:
    - hatás: hátrány
      érték: -1
      cél: té_dobás
    - hatás: mozgás_feleződik
  - fok: 2
    alcím: Erősen
    hatások:
    - hatás: hátrány
      érték: -2
      cél: té_dobás
    - hatás: mozgás_feleződik
- id: eszmélet
  név: Eszmélet
  kategória: fizikai
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Bódultság
    megjegyzések:
    - text: "Példa: sima részegség."
    hatások:
    - hatás: hátrány
      érték: -1
      cél: ké_dobás
    - hatás: hátrány
      érték: -1
      cél: té_dobás
    - hatás: hátrány
      érték: -1
      cél: képzettségpróba
    - hatás: hátrány
      érték: -1
      cél: tulajdonságpróba
    - hatás: támadás_elvesztés_1
    - hatás: szabad_varázslás_elvesztése
      megjegyzés: "kivéve papok: ők részegen is tudnak"
    - hatás: előny
      érték: 1
      cél: képzettségpróba
      alcél: "képzettség:fájdalomtűrés"
      megjegyzés: áfiumok, kábítószerek, fejbekólintás hatására
      szituációs: true
  - fok: 2
    alcím: Kábultság
    megjegyzések:
    - text: "Példa: pocsolya részegség."
    hatások:
    - hatás: hátrány
      érték: -2
      cél: ké_dobás
    - hatás: hátrány
      érték: -2
      cél: té_dobás
    - hatás: hátrány
      érték: -2
      cél: képzettségpróba
    - hatás: hátrány
      érték: -2
      cél: tulajdonságpróba
    - hatás: támadás_elvesztés_többszörös
    - hatás: varázslás_elvesztése
    - hatás: előny
      érték: 2
      cél: képzettségpróba
      alcél: "képzettség:fájdalomtűrés"
      megjegyzés: áfiumok, kábítószerek, fejbekólintás hatására
      szituációs: true
  - fok: 3
    alcím: Ájulás
    megjegyzések:
    - text: "Az Antyssjárás ebben az állapotban is működik."
    hatások:
    - hatás: harcképtelenség
    - hatás: automatikus_kudarc
      cél: ké_dobás
    - hatás: automatikus_kudarc
      cél: képzettségpróba
    - hatás: automatikus_kudarc
      cél: tulajdonságpróba
    - hatás: mozgás_képtelen
    - hatás: beszéd_némult
    - hatás: pszi_elvesztése
    - hatás: varázslás_elvesztése
  - fok: 4
    alcím: Kóma
    megjegyzések:
    - text: "Automatikusan Antysson ragadsz, nem is feltétlenül vagy vele tisztában, hogy ott vagy."
    - text: "Az Antyss a valóságod; Antyssjárás képzettség nélkül haladni, cselekedni is alig tudsz."
    hatások:
    - hatás: harcképtelenség
    - hatás: automatikus_kudarc
      cél: ké_dobás
    - hatás: automatikus_kudarc
      cél: képzettségpróba
    - hatás: automatikus_kudarc
      cél: tulajdonságpróba
    - hatás: mozgás_képtelen
    - hatás: beszéd_némult
    - hatás: pszi_elvesztése
    - hatás: varázslás_elvesztése
    - hatás: narratív
      cél: antyssjárás
      megjegyzés: Antysson ragadsz
- id: érzékvesztés
  név: Érzékvesztés
  kategória: fizikai
  többszörös: true
  alkategóriák: ["Látás", "Hallás", "Szaglás", "Tapintás", "Ízlelés"]
  fokok:
  - fok: 1
    alcím: Zavart
    megjegyzések:
    - text: "Átkozott (1) Érzékek esetén is ezt a Státuszt alkalmazd."
    hatások:
    - hatás: érzék_hátrány
      érték: -1
      érzék: "{alkategória}"
      megjegyzés: Érzék(x) Tulajdonságpróbára, Érzékenységgel dobott Képzettségpróbára
  - fok: 2
    alcím: Részleges
    megjegyzések:
    - text: "Átkozott (2) Érzékek esetén is ezt a Státuszt alkalmazd."
    hatások:
    - hatás: érzék_hátrány
      érték: -2
      érzék: "{alkategória}"
      megjegyzés: Érzék(x) Tulajdonságpróbára, Érzékenységgel dobott Képzettségpróbára
  - fok: 3
    alcím: Teljes
    megjegyzések:
    - text: "Átkozott (3) Érzékek esetén is ezt a Státuszt alkalmazd."
    hatások:
    - hatás: érzék_kioltott
      érzék: "{alkategória}"
      megjegyzés: Érzék(x) Tulajdonságpróbára, Érzékenységgel dobott Képzettségpróbára (automatikus kudarc)
- id: félelem
  név: Félelem
  kategória: szellemi
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Szorongás
    megjegyzések:
    - text: "Mi okozhatja? Nem bírja a stresszt; kezdő a harcban; meg lett félemlítve (pl. Befolyásolás+Félelemkeltés képzettség ellenpróbával, KM dönt)."
    hatások:
    - hatás: taktika_kötelező
      taktika: védő
      fok: 3
      megjegyzés: "VÉ:+3, TÉ:-6"
    - hatás: hátrány
      érték: -1
      cél: szociális_próba
  - fok: 2
    alcím: Rettegés
    megjegyzések:
    - text: "Pánik érzete is ide tartozik."
    hatások:
    - hatás: taktika_kötelező
      taktika: teljes_védekezés
    - hatás: automatikus_kudarc
      cél: szociális_próba
  - fok: 3
    alcím: Bénító félelem
    megjegyzések:
    - text: "Rögtön bele is lehet halni, de ez ellen véd a Szilánk megléte (tehát, aki kalandozó)."
    - text: "Csak mágia vagy démonok hatására kerülhetsz ebbe az állapotba."
    hatások:
    - hatás: mozgás_képtelen
    - hatás: harcképtelenség
    - hatás: varázslás_elvesztése
    - hatás: pszi_elvesztése
- id: fizikai
  név: Fizikai
  kategória: fizikai
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Fáradtság, Fejfájás
    megjegyzések:
    - text: "Példák: Edzettségedhez mérten elfáradtál hegymászás során; egy hete nem ettél."
    - text: "Kapcsolódik: Szívósság fortély."
    hatások:
    - hatás: hátrány
      érték: -1
      cél: ké_dobás
    - hatás: hátrány
      érték: -1
      cél: szellemi_próba
  - fok: 2
    alcím: Kimerültség
    megjegyzések:
    - text: "Példák: már nem is emlékszel, mikor aludtál utoljára; összeverten menekülsz órák óta."
    - text: "Kapcsolódik: Szívósság fortély."
    hatások:
    - hatás: vé_veszteség_duplázódik
    - hatás: hátrány
      érték: -1
      cél: ké_dobás
    - hatás: hátrány
      érték: -2
      cél: szellemi_próba
    - hatás: fp_s1
  - fok: 3
    alcím: Elcsigázottság
    megjegyzések:
    - text: "Példa: éhhalál szélén tengődés."
    - text: "Kapcsolódik: Szívósság fortély."
    - text: "Kapcsolódik: Harci akrobatika fortély."
    hatások:
    - hatás: hátrány
      érték: -2
      cél: ké_dobás
    - hatás: hátrány
      érték: -2
      cél: szellemi_próba
    - hatás: hátrány
      érték: -1
      cél: fizikai_próba
    - hatás: támadás_elvesztés_többszörös
    - hatás: vé_veszteség_duplázódik
    - hatás: mozgás_feleződik
    - hatás: fp_s2
    - hatás: fortély_letiltás
      fortély: harci_akrobatika
- id: hangulat
  név: Hangulat
  kategória: szellemi
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Fogékony
    megjegyzések:
    - text: "A nem-mágikus érzékszervi, vagy érzelmi ingerek fokozottabban hatnak rád. Érzelmileg jobban megnyílsz - pozitív és negatív értelemben is."
    hatások:
    - hatás: narratív
      cél: képzettségpróba
      megjegyzés: KM adhat Előny+1 vagy Hátrány-1 szituáció függően
  - fok: 2
    alcím: Inspirált
    megjegyzések:
    - text: "A karaktert valami inspirálja (egy műalkotás, egy táj, egy beszélgetés). Ez kreatív energiákat szabadíthat fel, de akár a figyelmét is elvonhatja a fontos dolgokról."
    hatások:
    - hatás: előny
      érték: 1
      cél: képzettségpróba
      megjegyzés: kreatív tevékenységekre
      szituációs: true
    - hatás: hátrány
      érték: -1
      cél: képzettségpróba
      megjegyzés: koncentrációt igénylő feladatokra
      szituációs: true
  - fok: 3
    alcím: Eufórikus
    megjegyzések:
    - text: "A karakter eufórikus állapotban van, talán valamilyen sikerélmény vagy varázslat hatására; ilyenkor túlzottan magabiztos, meggondolatlan döntéseket hozhat."
    hatások:
    - hatás: előny
      érték: 1
      cél: képzettségpróba
      megjegyzés: kreatív tevékenységekre
      szituációs: true
    - hatás: narratív
      cél: varázslás
      megjegyzés: Ellenséges varázstudó Asztrálmágia Komplexitás-próbájára Hátrány-1 (az asztrális befolyásolásnak jobban ellenáll az eufórikus személy)
    - hatás: hátrány
      érték: -2
      cél: képzettségpróba
      megjegyzés: koncentrációt igénylő feladatokra
      szituációs: true
  - fok: 4
    alcím: Obszesszív
    megjegyzések:
    - text: "A karakter megszállottá válik egy dolog vagy személy iránt. Ez motivációt adhat, de a megszállottság elvakíthatja és rossz döntésekhez vezethet."
    hatások:
    - hatás: előny
      érték: 1
      cél: képzettségpróba
      megjegyzés: obszesszió tárgyához kötődő (nem harci/misztikus dobásokra)
      szituációs: true
    - hatás: hátrány
      érték: -1
      cél: képzettségpróba
      megjegyzés: minden más
      szituációs: true
    - hatás: narratív
      cél: képzettségpróba
      megjegyzés: Automatikus kudarc (KM mondja meg mire)
- id: indulat
  név: Indulat
  kategória: szellemi
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Harag
    megjegyzések:
    - text: "Aki Haragból harcol, az kevesebbet törődik a védekezéssel, minden erejével ellenfele elpusztítására tör."
    - text: "Ebben az állapotban a karakter használhatja a Kezdeményező Taktikát; minden defenzív jellegű taktika és a Kiváró taktika tiltott."
    hatások:
    - hatás: taktika_kötelező
      taktika: támadó
      fok: "MAX"
    - hatás: narratív
      cél: harci_képesség
      megjegyzés: Kezdeményező taktika használható; minden defenzív jellegű taktika és a Kiváró taktika tiltott
  - fok: 2
    alcím: Gyűlölet
    hatások:
    - hatás: taktika_kötelező
      taktika: támadó
      fok: "MAX"
    - hatás: narratív
      cél: harci_képesség
      megjegyzés: Kezdeményező taktika használható; minden defenzív jellegű taktika és a Kiváró taktika tiltott
    - hatás: taktika_kötelező
      taktika: öngyilkos_roham
      megjegyzés: egyszer
      szituációs: true      # conditional (one-off): not set automatically
    - hatás: taktika_kötelező
      taktika: roham
      megjegyzés: utána, ha van hely
      szituációs: true      # conditional: not set automatically
  - fok: 3
    alcím: Őrjöngés
    hatások:
    - hatás: narratív
      cél: harci_képesség
      megjegyzés: Mint Gyűlölet + mindenkit megtámad
    - hatás: automatikus_kudarc
      cél: szociális_próba
    - hatás: automatikus_kudarc
      cél: szellemi_próba
- id: késztetés
  név: Késztetés
  kategória: szellemi
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Sugallat
    megjegyzések:
    - text: "Önuralom Tulajdonságpróbát kell dobni, hogy a karakter ellen tud-e állni a késztetésnek."
    - text: "Példa: Kleptománia - \"El kéne lopni valamit...\""
    - text: "Példa: Alkoholizmus (\"Igyak piát?\") - 1. fok: Önuralom tulajdonságpróba (Nagyivó)."
    hatások:
    - hatás: automatikus_próba
      cél: tulajdonságpróba
      alcél: "tulajdonság:önuralom"
      megjegyzés: Önuralom (12)
  - fok: 2
