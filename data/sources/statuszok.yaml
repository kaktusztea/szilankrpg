státuszok:
- id: áldott_tulajdonság
  név: Áldott Tulajdonság
  kategória: mágikus
  többszörös: true
  alkategória_forrás: tulajdonságok
  fokok:
  - fok: 1
    alcím: Előny+1
    hatások:
    - hatás: előny
      érték: 1
      cél: tulajdonságpróba
      alcél: "tulajdonság:{alkategória}"
      megjegyzés: feltétel esetén
      szituációs: true
  - fok: 2
    alcím: Előny+2
    hatások:
    - hatás: előny
      érték: 2
      cél: tulajdonságpróba
      alcél: "tulajdonság:{alkategória}"
      megjegyzés: feltétel esetén
      szituációs: true
