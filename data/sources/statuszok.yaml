- id: átkozott_viselkedés
  név: Átkozott Viselkedés
  kategória: szellemi
  többszörös: false
  alkategóriák: []
  fokok:
  - fok: 1
    alcím: Hátrány-1
    megjegyzések:
    - text: "Karma hátterek is okozhatnak Státusz változást."
    - text: "Példa: Hiszékeny - Hátrány-1 Emberismeret próbára, átverős szituációkban (Befolyásolás+Hazudozás vs Emberismeret)."
    - text: "Példa: Meggondolatlan - Hátrány-1 Önuralom próba; hajlamos vagy kockázatos döntéseket hozni, még akkor is, ha nincs rá szükség."
    - text: "Példa: Paranoiás - folyamatosan gyanakszol másokra, és nehezen bízol meg bárkiben."
    - text: "Példa: Irigy - nehezen tűröd, ha másnak több van, és hajlamos vagy emiatt rossz döntéseket hozni."
    hatások:
    - hatás: hátrány
      érték: -1
      cél: képzettségpróba
      megjegyzés: KM határozza meg
      szituációs: true
  - fok: 2
    alcím: Hátrány-2
    hatások:
    - hatás: hátrány
      érték: -2
      cél: képzettségpróba
      megjegyzés: KM határozza meg
      szituációs: true
- id: áldott_szakrális_bélyeg
