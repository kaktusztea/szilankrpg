    megjegyzések:
    - text: "Okozhatja Áldott személy Karma-Háttér is."
    - text: "Példák: Domvik érintése; Orwella érintése."
    hatások:
    - hatás: narratív
      cél: általános
      megjegyzés: "Aurádon egy szakrális bélyeg tündököl: {alkategória}"
  - fok: 2
    alcím: 2. fok
    megjegyzések:
    - text: "Okozhatja Áldott személy Karma-Háttér is."
    - text: "Példák: Domvik érintése; Orwella érintése."
    hatások:
    - hatás: narratív
      cél: általános
      megjegyzés: "Aurádon egy szakrális bélyeg tündököl: {alkategória}"
