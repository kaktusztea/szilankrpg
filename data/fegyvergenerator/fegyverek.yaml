# Fegyvergenerátor — EGYESÍTETT fegyver-katalógus (WORK paraméterek). Egy fegyver = egy rekord.
# Betölti: code/balance/fegyvergenerator_balansz.py (FEGYVEREK) és fegyvergenerator_fegyverlista.py (W).
#
#   nev         : lookup + megjelenített név
#   kat         : harcmodor — ha JELEN van, a fegyver MEGJELENIK a generált fegyverlistában (enélkül csak teszt-minta)
#   megj        : csak a NEM levezethető, NEM strukturált info (mechanika-jegyzet)
#   teszt_minta : true — a balansz self-testben/elemzésben részt vevő kiemelt fegyver
#   elvart      : {aktor: [TÉ, VÉ]} — regressziós elvárt bázisérték (Erő=0)
#   extrak   : [id, …] — hivatkozás a extrak.yaml katalógusra (KF, szituációs hatások). A Beszorítottat a
#                 fegyverhossz-kategória örökíti (konstansok.yaml), NEM itt kell felsorolni.
#   fegyver     : a Fegyver modell WORK paraméterei (a defaultok elhagyhatók)


