---
# fegyverek.schema.yaml — a data/fegyvergenerator/fegyverek.yaml rekordjainak sémája.
# EZT olvassa a validátor: code/balance/fegyverek_validator.py
#
# Stílus: strukturált (minden mező = {kötelező, típus, …}) — a validátor kommentek parse-olása
# NÉLKÜL dolgozik. A katalógus-alapú enumokat NEM duplikáljuk: a `forrás:` / `elem_forrás:` a
# konstansok.yaml ill. extrak.yaml ÉLŐ értékeire mutat (nem tud elcsúszni).
#
# Mező-leíró kulcsok:
#   kötelező    : true/false
#   típus       : str | int | bool | list | map
#   enum        : fix megengedett értékek (itt soroljuk)
#   forrás      : az érték a megadott katalógusban kell legyen (fegyverhossz|aktor|súly|idea|alapanyag|fejdarab|extrak)
#   elem_forrás : listánál MINDEN elem a katalógusban kell legyen
#   min         : lista min. hossza
#   default / példa / megjegyzés / almezok : csak dokumentáció

schema_version: 1

# ── Top-level rekord mezők ──
rekord:
  név:         {kötelező: true,  típus: str,  példa: "Kard, hosszú", megjegyzés: "lookup + megjelenített név"}
  kategória:   {kötelező: false, típus: str,  enum: [közelharci, kardvívó, lándzsavívó, romboló, ostorharc], megjegyzés: "harcmodor; ha JELEN van → a fegyver megjelenik a fegyverlistában (enélkül csak teszt-minta)"}
  megjegyzés:  {kötelező: false, típus: str,  példa: "Z, kétkezes", megjegyzés: "szabad mechanika-jegyzet (a levezethetőt/strukturáltat NEM ide)"}
  extrak:      {kötelező: false, típus: list, elem_forrás: extrak, példa: [kulonleges_felkeszites], megjegyzés: "id-k a extrak.yaml-ból (a Beszorítottat a fegyverhossz-kategória örökíti, NEM ide)"}
  fegyver:     {kötelező: true,  típus: map,  almezok: fegyver, megjegyzés: "a Fegyver modell WORK paraméterei — lásd a 'fegyver' szekciót lent"}
  teszt:       {kötelező: false, típus: map,  almezok: teszt, megjegyzés: "balansz self-test mezők csoportja (teszt_minta/elvart/elvart_1kez_kétkezes) — lásd a 'teszt' szekciót lent. NEM része az éles fegyvernek."}

# ── A `teszt:` blokk almezői (balansz self-test — NEM az éles fegyver része) ──
teszt:
  teszt_minta: {kötelező: false, típus: bool, példa: true, megjegyzés: "a balansz self-testben/elemzésben részt vevő kiemelt fegyver"}
  elvart:      {kötelező: false, típus: map,  példa: {vágóél-egyenes-átlagos: [6, 6]}, megjegyzés: "{aktor: [TÉ, VÉ]} — regressziós elvárt bázisérték (Erő=0); az aktor a fegyver aktorai közül"}
  elvart_1kez_kétkezes: {kötelező: false, típus: map, példa: {lándzsahegy-rövid-átlagos: [6, 6]}, megjegyzés: "{aktor: [TÉ, VÉ]} — a KÉTKEZES fegyver SZITUÁCIÓS 1-kezes (pajzs/kiesett kéz) elvárt bázisértéke (Erő=0), a konstansok.yaml → egykezes_forgatás.kétkezes levonással. CSAK kétkezes fegyverre értelmes — a modok() ezt nem emittálja automatikusan (mindig_emittált: false), ez a teszt validálja a doksiban kézzel leírt szituációs blokkokat."}

# ── A `fegyver:` blokk almezői (WORK paraméterek) ──
fegyver:
  hossz:             {kötelező: true,  típus: int,  forrás: fegyverhossz, példa: 3, megjegyzés: "fegyverhossz-kategória; konstansok.yaml fegyverhossz kulcsai: 0,1,2,3,5,7,9,12"}
  aktorok:           {kötelező: true,  típus: list, elem_forrás: aktor, min: 1, példa: [vágóél-egyenes-átlagos, pengehegy-kard], megjegyzés: "sebzési felületek; ELSŐ = elsődleges, többi = másodlagos. Értékek: konstansok.yaml aktor"}
  pengés:            {kötelező: false, típus: int,  enum: [0, 1], default: 0, megjegyzés: "pengés? (+1 TÉ/VÉ, +1 fejdarab, +1 SP)"}
  láncos:            {kötelező: false, típus: int,  enum: [0, 1], default: 0, megjegyzés: "láncos fej? (+1 SP, +1 Sebesség)"}
  hajlékony:         {kötelező: false, típus: int,  enum: [0, 1], default: 0, megjegyzés: "hajlékony (ostor)? (-2 VÉ, +1 Sebesség)"}
  súly:              {kötelező: false, típus: str,  forrás: súly, default: átlagos, megjegyzés: "konstansok.yaml súly: könnyű/átlagos/nehéz/súlyos"}
  idea:              {kötelező: false, típus: int,  forrás: idea, default: 0, megjegyzés: "inherens minőség; konstansok.yaml idea (-5..5)"}
  alapanyag:         {kötelező: false, típus: str,  forrás: alapanyag, default: acél, megjegyzés: "konstansok.yaml alapanyag (acél, feketeacél, kő, mithrill, …)"}
  fejdarab:          {kötelező: false, típus: int,  forrás: fejdarab, default: 0, megjegyzés: "fejdarab (bemenő index); konstansok.yaml fejdarab (0..3) adja a Sebesség/TÉ hatást. INVARIÁNS: 0 csak botvég/ököl aktornál (nincs 'rátett fej'); minden más aktornál (buzogányfej-*, lándzsahegy-*, vágóél-*, pengehegy-*, …) minimum 1 — a pengés:1 önmagában is +1-et ad, tehát fejdarab+pengés végösszege legyen ≥1"}
  súly_delta_cél:         {kötelező: false, típus: str,  enum: [sp, átütés], default: sp, megjegyzés: "a nehéz/súlyos súly-delta melyik harcérték-mezőbe menjen (SP VAGY Átütés); konstansok.yaml súly_delta_cél (metaadat/leírás)"}
  szálfegyver_nyélanyag:  {kötelező: false, típus: str,  forrás: szálfegyver_nyélanyag, default: sima, megjegyzés: "szálfegyver nyélanyag: sima/fanyelű/vasaltszárú/tömörszárú (súly/SP hatás); konstansok.yaml szálfegyver_nyélanyag"}
  erőbónusz_limit:   {kötelező: false, típus: int,  default: 99, megjegyzés: "az SP-re alkalmazható Erőbónusz felső plafonja; 99 = nincs plafon; EGYEDI per-fegyver érték (nem levezetett) — 1:1 áthalad a generált rekordba"}
  akadály:           {kötelező: false, típus: int,  enum: [0, 1, 2], default: 0, megjegyzés: "utazásnál mennyire akadályoz (0=nem, 1=lándzsa-kétfejű jellegű, 2=ostromfegyver/teljes vért/nagy pajzs, csak szekéren szállítható); NINCS harcérték-hatás, csak leíró/logisztikai — EGYEDI per-fegyver érték (nem levezetett)"}
