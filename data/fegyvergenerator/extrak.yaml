# Fegyvergenerátor — EXTRÁK katalógusa (egységes).
# Minden bejegyzés: {feltétel(ek) → hatás(ok)}. A `feltétel.típus` adja a jellegét,
# a `csoport` az ember-olvasható / megjelenítési besorolást.
# Hivatkozás id-vel, KÉT scope-on:
#   - fegyveren:            fegyverek.yaml → `extrak: [id, ...]`   (fegyver-egyedi)
#   - fegyverhossz-kat.:    konstansok.yaml fegyverhossz → `extrak: [id]`  (öröklődik minden ilyen hosszú fegyverre)
# A generátor a kettőt ÖSSZEFÉSÜLI (unió). A hatás SZITUÁCIÓS (nem a bázisérték);
# a futásidejű kiértékelés a reactive engine későbbi feladata.
#
# Mezők (a fortély/módosító vokabulárt tükrözi):
#   feltétel[] : ÉS-kapcsolat. {típus, név?, érték?}
#       típus: fortély (érték=fok≥) | tulajdonság (érték=szint≥) | státusz | harci_helyzet | cél_páncél | narratív (KM)
#   hatás[]    : {cél, mód, érték}. mód: flat | szorzó | override | ...

extrak:
  # ── FELKÉSZÍTÉS (kiképzett, opt-in — a régi „extra"/KF) ──
  - id: kulonleges_felkeszites
    név: "Különleges felkészítés (KF)"
    csoport: felkészítés
    leírás: >
      Belső harci iskola + Mesterfegyver-tudás kell. Enélkül a felkészítetlen
      alapértékek érvényesek; felkészítve a Mesterfegyver fortély e fegyverre adott bónusza megduplázódik.
    feltétel:
      - {típus: fortély, név: Mesterfegyver, érték: 1}   # az adott fegyverre, fok ≥ 1
      - {típus: narratív, név: iskola}                   # nem gépi: KM dönti el
    hatás:
      # MÁSODRENDŰ: a Mesterfegyver e fegyverre vonatkozó bónuszát szorozza (×2).
      - {cél: "Mesterfegyver-bónusz", mód: szorzó, érték: 2}

  # ── HARCI HELYZET (szituációs, automatikus) ──
  - id: beszorithato
    név: "Beszorított"
    csoport: harci_helyzet
    leírás: "Hosszú fegyver (kat. 7/9): Beszorított(2) státuszban nem forgatható rendesen, TÉ/VÉ:0."
    feltétel:
      - {típus: státusz, név: Beszorított, érték: 2}      # (2) = súlyosság/tier
    hatás:
      - {cél: TÉ, mód: override, érték: 0}
      - {cél: VÉ, mód: override, érték: 0}

  - id: panceltalan_roncsolasa
    név: "Páncéltalant jobban roncsol"
    csoport: harci_helyzet
    leírás: "Vérttelen célon nagyobb sebet ejt. Példa: Meneth"
    feltétel:
      - {típus: cél_páncél, érték: vértelen}
    hatás:
      - {cél: SP, mód: flat, érték: 3}

  - id: belharc_sfe0
    név: "Belharcban rések közt beszúr"
    csoport: harci_helyzet
    leírás: "Belharcban, földön lévő ellenfélnél a rések közt szúr — a páncél SFÉ-je 0."
    feltétel:
      - {típus: harci_helyzet, név: belharc}
    hatás:
      - {cél: SFÉ, mód: override, érték: 0}

  - id: pajzs_ve_felezes
    név: "Láncos: pajzs VÉ felezés"
    csoport: harci_helyzet
    leírás: "A láncos fej megkerüli a pajzsot — a pajzs adta VÉ feleződik."
    feltétel:
      - {típus: cél_felszereles, név: pajzs}
    hatás:
      - {cél: "pajzs-VÉ", mód: szorzó, érték: 0.5}

  - id: sfe_duplazodik
    név: "SFÉ dupla ellene"
    csoport: harci_helyzet
    leírás: "Íves rövid penge páncél ellen különösen rossz: a célpont páncél SFÉ-je duplán számít."
    feltétel:
      - {típus: cél_páncél, érték: páncélos}
    hatás:
      - {cél: SFÉ, mód: szorzó, érték: 2}

  # ── TULAJDONSÁG (építési/minőségi opció) ──
  - id: pontos
    név: "Pontos"
    csoport: tulajdonság
    leírás: >
      Precíziós szúróhegy: a Pontra támadás manőver Ellenpróbára +2.
      Csak pengehegy aktor + egykezes forgatás mellett értelmes.
    feltétel:
      - {típus: aktor, érték: pengehegy}
      - {típus: forgatás, érték: egykezes}
    hatás:
      - {cél: "Pontra támadás manőver", mód: flat, érték: 2}

  - id: lefegyverezhetobb
    név: "Lefegyverezhetőbb"
    csoport: tulajdonság
    leírás: >
      Az ilyen fegyvert az ellenfél könnyebben kiüti kezedből, könnyebben eltöri.
    feltétel:
      - {típus: forgatás, érték: egykezes}
    hatás:
      - cél: "manőver:lefegyverzés"
        érték: -2
        mód: "flat"
        forrás: ""
        arány: 0
        feltétel: "manőver_állapot:passzív"
      - cél: "manőver:fegyvertörés"
        érték: -2
        mód: "flat"
        forrás: ""
        arány: 0
        feltétel: "manőver_állapot:passzív"


  - id: zuzo_ellen_rosszabb
    név: "Zúzó fegyver ellen rosszabb"
    csoport: tulajdonság
    leírás: >
      Fegyvered nem túl alkalmas zúzó fegyverek támadásainak hárítására.
      Elszenvedett VÉ csökkenésed duplázódik.
    feltétel:
      - "ellenfél_fegyver_sebzésjelleg:zúzó"
    hatás:
      - cél: "vé_veszteség"
        érték: 2
        mód: "szorzó"
