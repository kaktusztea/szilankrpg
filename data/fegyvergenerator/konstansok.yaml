# Fegyvergenerátor — konstans paramétertáblák (a modell bemenete).
# Ezt olvassa be a code/balance/fegyvergenerator_balansz.py. A szkriptekben NINCS adat.
# FIGYELEM: tervezői eszköz adata, NEM a data/sources pipeline része (a generate_tables.py
# csak a data/sources/ könyvtárat dolgozza fel — ez a mappa kimarad).
# Kulcsnevek a data/sources standardhoz igazítva: TÉ, VÉ, SP, sebesség, átütés, sebzésjelleg, forgatás, erő.

# fegyverhossz: kategória -> TÉ, VÉ, SP, sebesség, forgatás
fegyverhossz:
  0:  {TÉ: 0,  VÉ: 0,  SP: 0, sebesség: 5, forgatás: egykezes}
  1:  {TÉ: 1,  VÉ: 1,  SP: 1, sebesség: 5, forgatás: egykezes}
  2:  {TÉ: 2,  VÉ: 2,  SP: 2, sebesség: 5, forgatás: egykezes}
  3:  {TÉ: 3,  VÉ: 3,  SP: 3, sebesség: 6, forgatás: egykezes}
  5:  {TÉ: 5,  VÉ: 5,  SP: 4, sebesség: 6, forgatás: másfélkezes}
  7:  {TÉ: 7,  VÉ: 7,  SP: 5, sebesség: 7, forgatás: kétkezes, extrak: [beszorithato]}
  9:  {TÉ: 9,  VÉ: 9,  SP: 5, sebesség: 8, forgatás: kétkezes, extrak: [beszorithato]}
  12: {TÉ: 12, VÉ: 12, SP: 5, sebesség: 9, forgatás: kétkezes}

# aktor: név -> sebzésjelleg, SP, átütés, TÉ, VÉ, sebesség
aktor:
  botvég:                      {sebzésjelleg: zúzó,         SP: 0, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  buzogányfej-tompa:           {sebzésjelleg: zúzó,         SP: 2, átütés: 0, TÉ: 0, VÉ: -2, sebesség: 0}
  buzogányfej-szöges:          {sebzésjelleg: zúzó,         SP: 1, átütés: 2, TÉ: 0, VÉ: -3, sebesség: 0}
  pengehegy-apró:              {sebzésjelleg: szúró,        SP: 0, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  pengehegy-tőr:               {sebzésjelleg: szúró,        SP: 1, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  pengehegy-kard:              {sebzésjelleg: szúró,        SP: 2, átütés: 1, TÉ: 0, VÉ: 0,  sebesség: 0}
  vágóél-egyenes-rövid:        {sebzésjelleg: vágó-egyenes, SP: 0, átütés: 0, TÉ: 1, VÉ: 1,  sebesség: 0}
  vágóél-egyenes-átlagos:      {sebzésjelleg: vágó-egyenes, SP: 1, átütés: 0, TÉ: 2, VÉ: 2,  sebesség: 0}
  vágóél-egyenes-nagy:         {sebzésjelleg: vágó-egyenes, SP: 2, átütés: 0, TÉ: 2, VÉ: 2,  sebesség: 0}
  vágóél-íves-rövid:           {sebzésjelleg: vágó-íves,    SP: 1, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  vágóél-íves-átlagos:         {sebzésjelleg: vágó-íves,    SP: 2, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 1}
  vágóél-íves-nagy:            {sebzésjelleg: vágó-íves,    SP: 3, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 1}
  lándzsahegy-rövid-átlagos:   {sebzésjelleg: szúró,        SP: 3, átütés: 2, TÉ: 0, VÉ: 0,  sebesség: 0}
  lándzsahegy-rövid-széles:    {sebzésjelleg: szúró,        SP: 4, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  lándzsahegy-rövid-keskeny:   {sebzésjelleg: szúró,        SP: 2, átütés: 4, TÉ: 0, VÉ: 0,  sebesség: 0}
  lándzsahegy-tőrhossz:        {sebzésjelleg: szúró,        SP: 4, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  lándzsahegy-rövidkardhossz:  {sebzésjelleg: szúró,        SP: 5, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}
  lándzsahegy-hosszúkardhossz: {sebzésjelleg: szúró,        SP: 6, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 1}
  kampós-vég:                  {sebzésjelleg: nincs,        SP: 0, átütés: 0, TÉ: 0, VÉ: 0,  sebesség: 0}

# fejdarab: n -> sebesség, TÉ
fejdarab:
  0: {sebesség: 0, TÉ: 0}
  1: {sebesség: 1, TÉ: 0}
  2: {sebesség: 2, TÉ: -2}
  3: {sebesség: 3, TÉ: -4}

# súly: név -> SP, sebesség, erő_követelmény (a forgatáshoz szükséges minimális Erő; NEM azonos az erőbónusz_limittel)
# DÖNTÉS: könnyű = -1 SP (a vitatott kérdés lezárva). nehéz/súlyos: SP VAGY átütés (a fegyver nehéz_módosító dönt).
# id: rendezett súlykategória-index (a súly-delta EZT tolja, clamp-pel a szélső osztályokra)
súly:
  könnyű:  {id: 1, SP: -1, sebesség: -1, erő_követelmény: 0}
  átlagos: {id: 2, SP: 0,  sebesség: 0,  erő_követelmény: 0}
  nehéz:   {id: 3, SP: 1,  sebesség: 1,  erő_követelmény: 2}
  súlyos:  {id: 4, SP: 2,  sebesség: 2,  erő_követelmény: 3}

# idea: szint -> TÉ, VÉ, SP, sebesség, súly-delta (súly)
idea:
  -5: {TÉ: -3, VÉ: -3, SP: -5, sebesség: 2,  súly: 0}
  -4: {TÉ: -2, VÉ: -2, SP: -4, sebesség: 1,  súly: 0}
  -3: {TÉ: -1, VÉ: -1, SP: -3, sebesség: 1,  súly: 0}
  -2: {TÉ: -1, VÉ: -1, SP: -2, sebesség: 0,  súly: 0}
  -1: {TÉ: 0,  VÉ: 0,  SP: -1, sebesség: 0,  súly: 0}
  0:  {TÉ: 0,  VÉ: 0,  SP: 0,  sebesség: 0,  súly: 0}
  1:  {TÉ: 0,  VÉ: 0,  SP: 1,  sebesség: 0,  súly: 0}
  2:  {TÉ: 1,  VÉ: 1,  SP: 2,  sebesség: 0,  súly: 0}
  3:  {TÉ: 1,  VÉ: 1,  SP: 3,  sebesség: -1, súly: 0}
  4:  {TÉ: 2,  VÉ: 2,  SP: 4,  sebesség: -1, súly: -1}
  5:  {TÉ: 3,  VÉ: 3,  SP: 5,  sebesség: -2, súly: -2}

# alapanyag: név -> TÉ, VÉ, SP, opcionális súly-delta (súly) és átütés
alapanyag:
  test:       {TÉ: -3, VÉ: -3, SP: -5}
  krumpli:    {TÉ: -3, VÉ: -3, SP: -5}
  csont:      {TÉ: 0,  VÉ: 0,  SP: -4}
  kő:         {TÉ: 0,  VÉ: 0,  SP: -3}
  bronz:      {TÉ: 0,  VÉ: 0,  SP: -2}
  acél:       {TÉ: 0,  VÉ: 0,  SP: 0}
  abbitacél:  {TÉ: 1,  VÉ: 1,  SP: 1}
  mithrill:   {TÉ: 1,  VÉ: 1,  SP: 2,  súly: -1}
  lunír:      {TÉ: 1,  VÉ: 1,  SP: 0,  súly: -2}   # gyorsaság-fém
  feketeacél: {TÉ: 1,  VÉ: 1,  SP: 1}              # Mara-Sequor — Chi-harcban törhetetlen
  ősfém:      {TÉ: 2,  VÉ: 2,  SP: 2}              # 1-2. kori — szellem/élőholt sebez
  élőereklye: {TÉ: 2,  VÉ: 2,  SP: 3}              # törhetetlen, kötődik
  álomfém:    {TÉ: 1,  VÉ: 1,  SP: 1,  átütés: 2}  # +2 átütés, mágiaűrben elveszik

# sebzésjelleg TÉ/VÉ módosító alkotáskor (jelleg-szint). Jelenleg mind 0:
# a vágó-egyenes +2-je az AKTOR szinten van elosztva; a szúró NEM kap flat TÉ-t (döntés).
tipus_tv:
  zúzó:         {TÉ: 0, VÉ: 0}
  szúró:        {TÉ: 0, VÉ: 0}
  vágó-egyenes: {TÉ: 0, VÉ: 0}
  vágó-íves:    {TÉ: 0, VÉ: 0}
  nincs:        {TÉ: 0, VÉ: 0}

# forgatás-kényszer: a fegyvert NEM az alapfogásával forgatva (levonások).
#   másfélkezes_egykézzel = STANDARD variáns: a másfélkezes fegyver 1 kézzel is forgatható (MK).
#                           A generátor a másfélkezes fegyverekhez automatikusan emittál egy 1 kezes sort is.
#   kétkezes_egykézzel     = SZITUÁCIÓ: kétkezes fegyver 1 kézzel (pl. kiesett kéz, pajzs) — nem emittált sor,
#                           hanem futásidejű helyzet-módosító.
# TÉ/VÉ: delta; átütés_max / erőbónusz_limit_max: felső korlát (override). A sebzést (SP) NEM érinti.
forgatás_levonás:
  másfélkezes_egykézzel: {TÉ: -2, VÉ: -2, átütés_max: 0, erőbónusz_limit_max: 2}
  kétkezes_egykézzel:    {TÉ: -4, VÉ: -4, átütés_max: 0, erőbónusz_limit_max: 0}

# szálfegyver nyélanyag: típus -> SP (direkt), súly (kategória-eltolás, mint idea/alapanyag suly_delta)
# A fanyelű Fegyvertörés-ellenpróba +2 és a Felszerelés-pont RUNTIME/logisztika — bázis-hatásuk nincs.
szálfegyver_nyélanyag:
  sima:        {SP: 0, súly: 0}   # alap (nincs speciális nyél)
  fanyelű:     {SP: 0, súly: 0, extrak: [fanyel_fegyvertores_konnyebb]}   # bázis-hatás nincs; Fegyvertörés-büntetés (a fa nyél könnyebben törik)
  vasaltszárú: {SP: 0, súly: 1}   # +1 súly kategória
  tömörszárú:  {SP: 1, súly: 2}   # +1 SP, +2 súly kategória (+1 Felszerelés pont = logisztika)

# hajlékony (ostor-jelleg): 0/1 param táblája — bázis (VÉ/Sebesség) + örökölt SZITUÁCIÓS extrák.
# A fegyverlista az extrákat innen örökíti (mint a fegyverhossz → beszorithato, szálfegyver_nyélanyag → fanyelű).
hajlékony:
  0: {VÉ: 0,  sebesség: 0}
  1: {VÉ: -2, sebesség: 1, extrak: [pajzs_megkerules, fegyvertores_immunis]}

# balansz-teszt konstansok
k20_atlag: 10.5     # k20 átlagdobás
ep_per_kat: 9.0     # ~ÉP/4 tipikus kalandozónál (sebesülés-kategória)
