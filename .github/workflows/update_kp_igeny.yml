name: Update KP igény json

on:
  push:
    branches: [ master ]
    paths:
      - 'md/030_05_kepzettsegszintek_kp_igenye.md'
      - 'code/process_kp_igeny.py'
      - '.github/workflows/update_kp_igeny.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'md/030_05_kepzettsegszintek_kp_igenye.md'
      - 'code/process_kp_igeny.py'
      - '.github/workflows/update_kp_igeny.yml'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.15
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'

    - name: Execute process_kp_igeny.py
      run: python code/process_kp_igeny.py

    - name: Check for Changes
      run: |
        if [[ $(git status --porcelain) ]]; then
          echo "files_modified=true" > $GITHUB_ENV
        else
          echo "files_modified=false" > $GITHUB_ENV
        fi

    - name: Configure Git
      if: ${{ env.files_modified == 'true' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit Changes
      if: ${{ env.files_modified == 'true' }}
      run: |
        git add .
        git commit -m "GitHub Action: data/tables/kepzettseg_kp.json"

    - name: Push Changes
      if: ${{ env.files_modified == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push
