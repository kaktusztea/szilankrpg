name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/karakter/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - run: pip install pyyaml

      - name: Generate tables from YAML
        run: python3 data/generate_tables.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/karakter/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/karakter

      - name: Build
        run: npm run build
        working-directory: web/karakter

      - name: Copy data to dist
        run: mkdir -p web/karakter/dist/data/tables web/karakter/dist/data/karakter && cp data/tables/*.json web/karakter/dist/data/tables/ && cp data/rules.json web/karakter/dist/data/ && cp data/karakter/*.json web/karakter/dist/data/karakter/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/karakter/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
