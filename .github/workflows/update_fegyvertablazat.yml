name: Update Fegyvertáblázat (Fegyvergenerátor v2)

on:
  push:
    branches: [ master ]
    paths:
      - 'data/sources/fegyverek/**.yaml'
      - 'data/sources/fegyverek/fegyverek_fixed.json'
      - 'code/sync_fegyvertablazatok.py'
      - 'code/balance/fegyvergenerator_balansz.py'
      - 'code/balance/fegyvergenerator_harcszimulator.py'
      - 'code/balance/fegyvergenerator_taktikai_ai.py'
      - 'code/balance/fegyvergenerator_data_adapter.py'
      - 'code/balance/extrak_validator.py'
      - 'code/balance/fegyverek_validator.py'
      - 'data/tables/taktikak.json'
      - 'data/tables/harci_helyzetek.json'
      - 'data/tables/manoverek.json'
      - 'data/tables/statuszok.json'
      - 'data/sources/konstansok.yaml'
      - '.github/workflows/update_fegyvertablazat.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'data/sources/fegyverek/**.yaml'
      - 'data/sources/fegyverek/fegyverek_fixed.json'
      - 'code/sync_fegyvertablazatok.py'
      - 'code/balance/fegyvergenerator_balansz.py'
      - 'code/balance/fegyvergenerator_harcszimulator.py'
      - 'code/balance/fegyvergenerator_taktikai_ai.py'
      - 'code/balance/fegyvergenerator_data_adapter.py'
      - 'code/balance/extrak_validator.py'
      - 'code/balance/fegyverek_validator.py'
      - 'data/tables/taktikak.json'
      - 'data/tables/harci_helyzetek.json'
      - 'data/tables/manoverek.json'
      - 'data/tables/statuszok.json'
      - 'data/sources/konstansok.yaml'
      - '.github/workflows/update_fegyvertablazat.yml'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14.4'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    # Self-test kapu: hibás modellből ne generálódjon/commitolódjon tábla.
    - name: Self-test - fegyvergenerátor (séma + regresszió)
      run: python code/balance/fegyvergenerator_balansz.py > /dev/null

    - name: Self-test - harcszimulátor
      run: python code/balance/fegyvergenerator_harcszimulator.py > /dev/null

    - name: Self-test - taktikai AI
      run: python code/balance/fegyvergenerator_taktikai_ai.py > /dev/null

    - name: Execute sync_fegyvertablazatok.py
      run: python code/sync_fegyvertablazatok.py

    - name: Check for Changes
      run: |
        if [[ $(git status --porcelain) ]]; then
          echo "files_modified=true" > $GITHUB_ENV
        else
          echo "files_modified=false" > $GITHUB_ENV
        fi

    - name: Configure Git
      if: ${{ env.files_modified == 'true' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit Changes
      if: ${{ env.files_modified == 'true' }}
      run: |
        git add .
        git commit -m "GitHub Action: sync_fegyvertablazatok.py"

    - name: Push Changes
      if: ${{ env.files_modified == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push
