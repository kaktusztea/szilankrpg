name: Update Fegyvertáblázat (Fegyvergenerátor v2)

on:
  push:
    branches: [ master ]
    paths:
      - 'data/sources/fegyverek/**.yaml'
      - 'data/sources/fegyverek/fegyverek_fixed.json'
  pull_request:
    branches: [ master ]
    paths:
      - 'data/sources/fegyverek/**.yaml'
      - 'data/sources/fegyverek/fegyverek_fixed.json'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14.4'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Execute sync_fegyvertablazat_kozelharci.py
      run: python code/sync_fegyvertablazat_kozelharci.py

    - name: Check for Changes
      run: |
        if [[ $(git status --porcelain) ]]; then
          echo "files_modified=true" > $GITHUB_ENV
        else
          echo "files_modified=false" > $GITHUB_ENV
        fi

    - name: Configure Git
      if: ${{ env.files_modified == 'true' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Commit Changes
      if: ${{ env.files_modified == 'true' }}
      run: |
        git add .
        git commit -m "GitHub Action: sync_fegyvertablazat_kozelharci.py"

    - name: Push Changes
      if: ${{ env.files_modified == 'true' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git push
